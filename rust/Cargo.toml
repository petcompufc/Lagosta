[package]
name = "lago"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = {
  version = "0.5.4",
  features = ["api-4-7", "experimental-threads", "register-docs"]
}
imageproc = { version = "0.27.0", features = ["rayon"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1
debug = false
